<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Retro Rumble</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d0820">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --bg: #0d0820; --bg2: #1a0f3a; --panel: #1d1340; --line: #3a2a6e;
  --ink: #f6f1ff; --muted: #a99cc9;
  --surface: #1a1238; --surface-2: #231950; --border: #ffffff14;
  --pink: #ff3d9a; --cyan: #2de2e6; --yellow: #ffd23f; --green: #3ef08a; --red: #ff4d6d;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
html { background: var(--bg); }
body {
  background: radial-gradient(ellipse at top, var(--bg2), var(--bg) 70%) fixed;
  color: var(--ink); font-family: Inter, system-ui, sans-serif;
  overflow-x: hidden; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
body::before { /* synthwave grid floor */
  content: ""; position: fixed; inset: 55% -50% -10%; z-index: -1; pointer-events: none;
  background-image: linear-gradient(var(--pink) 1px, transparent 1px), linear-gradient(90deg, var(--pink) 1px, transparent 1px);
  background-size: 60px 60px; opacity: .06; transform: perspective(300px) rotateX(60deg);
  animation: grid 4s linear infinite;
}
@keyframes grid { to { background-position: 0 60px; } }
button { font: inherit; color: inherit; cursor: pointer; border: 0; }
button:disabled { cursor: default; opacity: .35; }
input, textarea { font: inherit; color: var(--ink); background: #0008; border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; width: 100%; }
input:focus, textarea:focus { outline: none; border-color: var(--cyan); }
.display { font-family: Bungee, Inter, sans-serif; letter-spacing: .02em; }
.muted { color: var(--muted); }
.big {
  font-family: Bungee, sans-serif; font-size: 1.3rem; padding: 16px 28px; border-radius: 16px;
  background: linear-gradient(135deg, var(--pink), #ff8a3d); box-shadow: 0 6px 0 #a3125c, 0 0 30px #ff3d9a55;
  transition: transform .08s;
}
.big:active { transform: translateY(4px); box-shadow: 0 2px 0 #a3125c; }
.ghost { background: transparent; border: 2px solid var(--line); border-radius: 12px; padding: 10px 16px; color: var(--muted); }
.brand {
  font-family: Bungee, sans-serif; font-size: clamp(2.2rem, 7vw, 5rem); line-height: 1; text-align: center;
  background: linear-gradient(180deg, var(--yellow), var(--pink) 60%, #8b5cf6); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 18px #ff3d9a88); margin: 0;
}
.fresh .pop { animation: pop .45s cubic-bezier(.2, 1.6, .4, 1) both; }
.fresh .pop:nth-child(2) { animation-delay: .06s; } .fresh .pop:nth-child(3) { animation-delay: .12s; }
.fresh .pop:nth-child(4) { animation-delay: .18s; } .fresh .pop:nth-child(5) { animation-delay: .24s; }
@keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
@keyframes wobble { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
@keyframes pulse { 50% { transform: scale(1.06); } }

/* landing */
.landing { max-width: 440px; margin: 0 auto; padding: 48px 16px; display: grid; gap: 22px; }
.landing .tag { text-align: center; margin-top: -8px; }
.card { background: var(--panel); border: 2px solid var(--line); border-radius: 20px; padding: 20px; display: grid; gap: 12px; }
.card h2 { margin: 0; font-family: Bungee, sans-serif; font-size: 1.1rem; color: var(--cyan); }
#code { text-transform: uppercase; font-family: Bungee, sans-serif; font-size: 1.6rem; letter-spacing: .3em; text-align: center; }

/* host */
.host { min-height: 100vh; padding: 24px clamp(16px, 4vw, 48px); display: flex; flex-direction: column; gap: 20px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.qcount { color: var(--muted); font-weight: 600; font-size: .95rem; } .qcount b { color: var(--ink); }
.modbadge { padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: .95rem; color: var(--ink); background: color-mix(in srgb, var(--c) 16%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); } .modbadge b { color: var(--c); } .modbadge span { color: var(--muted); }
.lobby-grid { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 24px; flex: 1; }
@media (max-width: 760px) { .lobby-grid { grid-template-columns: 1fr; } }
.joinbox { background: var(--panel); border: 2px solid var(--line); border-radius: 24px; padding: 24px; text-align: center; display: grid; gap: 10px; justify-items: center; align-content: start; }
.joinbox .url { font-weight: 800; word-break: break-all; }
.joinbox .roomcode { font-family: Bungee, sans-serif; font-size: 4rem; letter-spacing: .12em; color: var(--yellow); text-shadow: 0 0 24px #ffd23f88; line-height: 1; }
#qr { background: #fff; padding: 10px; border-radius: 12px; }
#qr img, #qr canvas { display: block; }
.roster h2 { font-family: Bungee, sans-serif; margin: 0 0 14px; }
.bubbles { display: flex; flex-wrap: wrap; gap: 12px; }
.bubble { background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 8px 18px 8px 10px; font-weight: 800; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) both; }
.bubble .av { font-size: 1.8rem; animation: wobble 2.4s ease-in-out infinite; display: inline-block; }
.bubble.off { opacity: .4; }
.qedit summary { cursor: pointer; color: var(--muted); }
.qedit textarea { margin-top: 10px; min-height: 260px; font-family: ui-monospace, monospace; font-size: .9rem; }
.qedit .help { font-size: .85rem; margin-top: 6px; }
.lobby-actions { display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap; }
.host-foot { align-items: center; }

.wheel-stage { flex: 1; display: grid; place-items: center; gap: 12px; padding-top: 16px; }
.wheel-wrap { position: relative; width: min(56vh, 86vw); aspect-ratio: 1; }
.wheel { position: absolute; inset: 0; border-radius: 50%; border: 8px solid #ffffff2e; background-origin: border-box; box-shadow: 0 0 60px #ff3d9a66, inset 0 0 40px #0006; transition: transform 4.2s cubic-bezier(.12, .7, .1, 1); }
.wheel .seg { position: absolute; inset: 0; }
.wheel .seg span { position: absolute; left: 50%; top: 8%; transform: translateX(-50%); white-space: nowrap; font-weight: 800; color: #120a26; text-align: center; line-height: 1.1; font-size: clamp(.7rem, 1.7vh, 1rem); }
.wheel .seg span b { display: block; font-size: 2em; }
.wheel-wrap .hub { position: absolute; inset: 42%; border-radius: 50%; background: var(--bg); border: 4px solid var(--yellow); display: grid; place-items: center; font-size: 2rem; }
.pointer { position: absolute; left: 50%; top: -22px; transform: translateX(-50%); font-size: 3rem; color: var(--yellow); filter: drop-shadow(0 0 10px var(--yellow)); z-index: 2; }
.mod-reveal { text-align: center; min-height: 150px; }
.mod-reveal .m-emoji { font-size: 3rem; display: block; animation: pulse .6s ease-in-out infinite; }
.mod-reveal .m-label { font-family: Bungee, sans-serif; font-size: clamp(2rem, 5vw, 3.4rem); }
.mod-reveal .m-desc { font-size: 1.3rem; color: var(--muted); }

.qtext { font-weight: 800; font-size: clamp(1.8rem, 3.8vw, 3.1rem); letter-spacing: -.02em; text-align: center; margin: 0; line-height: 1.15; text-wrap: balance; }
.qtext.small { font-size: clamp(1.3rem, 2.4vw, 1.9rem); color: var(--muted); }
.timer { position: relative; height: 22px; background: #0006; border-radius: 999px; overflow: hidden; border: 2px solid var(--line); }
.timer-fill { position: absolute; inset: 0; background: linear-gradient(90deg, var(--green), var(--yellow), var(--red)); background-size: 300% 100%; transform-origin: left; }
.timer-num { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-family: Bungee, sans-serif; font-size: .8rem; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.tiles.four { grid-template-columns: repeat(2, 1fr); }
.tile { --c: #888; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 18px 20px; font-size: clamp(1.15rem, 2.1vw, 1.55rem); font-weight: 700; display: flex; align-items: center; gap: 16px; }
.shape-chip { flex: none; width: 46px; height: 46px; border-radius: 12px; background: var(--c); color: #fff; display: grid; place-items: center; font-size: 1.3rem; box-shadow: 0 4px 14px color-mix(in srgb, var(--c) 40%, transparent); }
.live { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-height: 54px; }
.live .count { font-family: Bungee, sans-serif; font-size: 1.6rem; }
.live .in { font-size: 2rem; animation: pop .4s cubic-bezier(.2, 1.6, .4, 1) both; position: relative; }
.live .in.allin::after { content: "🎲"; position: absolute; font-size: .9rem; right: -6px; bottom: -4px; }
.host-foot { display: flex; justify-content: flex-end; gap: 12px; margin-top: auto; }

.verdict { display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap; font-size: clamp(1.1rem, 2vw, 1.45rem); font-weight: 700; }
.verdict .pill { --c: #888; background: var(--c); color: #fff; border-radius: 999px; padding: 8px 18px; font-weight: 800; box-shadow: 0 0 30px color-mix(in srgb, var(--c) 45%, transparent); }
.verdict .pill small { font-weight: 600; opacity: .85; margin-right: 6px; }
.reveal-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; }
@media (max-width: 860px) { .reveal-grid { grid-template-columns: 1fr; } }
.bars { display: grid; gap: 10px; align-content: start; }
.barrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; font-weight: 800; }
.barrow .track { grid-column: 1 / -1; height: 30px; border-radius: 10px; background: #0005; overflow: hidden; }
.barrow .fill { height: 100%; border-radius: 10px; width: 0; transition: width 1s cubic-bezier(.2, .9, .3, 1); }
.barrow.lose { opacity: .4; }
.barrow.win .label::after { content: " ✔"; color: var(--green); }
.board { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 10px; display: grid; align-content: start; }
.board-title { color: var(--muted); font-weight: 700; font-size: .8rem; text-transform: uppercase; letter-spacing: .12em; padding: 6px 10px 8px; }




.rtiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; align-content: start; }
.rtiles.four { grid-template-columns: 1fr 1fr; }
.rtile { --c: #888; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 16px 18px; display: grid; gap: 12px; align-content: start; transition: opacity .3s; position: relative; }
.rtile.lose { opacity: .4; }
.rtile.win { background: color-mix(in srgb, var(--c) 22%, var(--surface)); border: 2px solid var(--c); box-shadow: 0 0 34px color-mix(in srgb, var(--c) 35%, transparent); }
.rtile.win::after { content: "✔"; position: absolute; top: -12px; right: -12px; width: 34px; height: 34px; border-radius: 50%; background: var(--green); color: #0b2a1a; display: grid; place-items: center; font-weight: 900; box-shadow: 0 0 0 4px var(--bg); }
.rt-top { display: flex; align-items: center; gap: 14px; font-size: 1.2rem; font-weight: 700; }
.rt-text { flex: 1; }
.rt-count { font-weight: 800; font-size: 1.5rem; font-variant-numeric: tabular-nums; color: var(--muted); } .rtile.win .rt-count { color: var(--ink); }
.rt-who { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; padding-left: 60px; }
.rt-who span { display: inline-flex; align-items: center; gap: 5px; background: #ffffff10; border-radius: 999px; padding: 3px 10px 3px 5px; font-size: 1.1rem; }
.rt-who small { font-size: .82rem; font-weight: 600; }
.rt-who .rt-none { background: none; font-size: .85rem; color: var(--muted); padding-left: 0; }
.brow .nt { display: block; font-size: .78rem; color: var(--muted); font-weight: 600; }
.brow .delta { padding: 2px 8px; border-radius: 999px; font-size: .8rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.brow .delta.up { background: #3ef08a22; }
.brow .delta.down { background: #ff4d6d22; }
.brow .delta.zero { visibility: hidden; }
.brow { display: grid; grid-template-columns: 36px 40px 1fr auto auto; align-items: center; gap: 10px; padding: 10px; font-weight: 700; border-radius: 12px; }
.brow + .brow { border-top: 1px solid var(--border); border-radius: 0; }
.brow .rk { color: var(--muted); font-weight: 800; text-align: center; font-size: 1.05rem; }
.brow .av { font-size: 1.6rem; }
.brow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.up { color: var(--green); } .down { color: var(--red); }
.brow .sc { font-weight: 800; font-size: 1.25rem; min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }

.end { align-items: center; text-align: center; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 14px; margin-top: 20px; }
.podium .col { width: min(200px, 28vw); display: grid; gap: 8px; justify-items: center; }
.podium .av { font-size: 3.6rem; animation: wobble 1.6s ease-in-out infinite; display: inline-block; }
.podium .nm { font-weight: 800; font-size: 1.2rem; }
.podium .block { width: 100%; border-radius: 14px 14px 0 0; display: grid; place-items: start center; padding-top: 12px; font-family: Bungee, sans-serif; font-size: 2rem; color: #120a26; animation: rise .9s cubic-bezier(.2, 1.2, .4, 1) both; transform-origin: bottom; }
@keyframes rise { from { transform: scaleY(0); } }
.podium .p1 .block { height: 220px; background: var(--yellow); animation-delay: 1s; }
.podium .p2 .block { height: 160px; background: #d9e1ff; animation-delay: .5s; }
.podium .p3 .block { height: 110px; background: #ff9f5a; }
.rest { color: var(--muted); }

/* floating reactions + toasts */
.float { position: fixed; bottom: -60px; font-size: 3rem; pointer-events: none; z-index: 10; animation: floatup 2.6s ease-out forwards; }
@keyframes floatup { to { transform: translateY(-85vh) rotate(var(--r)); opacity: 0; } }
#toasts { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); display: grid; gap: 8px; z-index: 20; width: min(92vw, 520px); }
.toast { background: #120a26ee; border: 2px solid var(--cyan); border-radius: 14px; padding: 12px 16px; font-weight: 800; text-align: center; animation: pop .35s cubic-bezier(.2, 1.6, .4, 1) both; box-shadow: 0 0 24px #2de2e655; }
#conn { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: var(--red); color: #fff; padding: 6px 14px; border-radius: 999px; font-weight: 800; z-index: 30; display: none; }

/* player */
.phone { max-width: 520px; margin: 0 auto; min-height: 100vh; padding: 16px 16px 96px; display: flex; flex-direction: column; gap: 14px; }
.me { display: flex; align-items: center; gap: 10px; font-weight: 800; }
.me .av { font-size: 1.8rem; }
.me .sc { margin-left: auto; font-family: Bungee, sans-serif; color: var(--yellow); }
.center { flex: 1; display: grid; place-items: center; text-align: center; align-content: center; gap: 12px; }
.huge { font-size: 5.5rem; line-height: 1; }
.phone .qtext { font-size: clamp(1.1rem, 5vw, 1.5rem); }
.answers { display: grid; gap: 10px; }
.answers.many { grid-template-columns: 1fr 1fr; }
.answer { border-radius: 16px; padding: 18px 16px; font-size: 1.1rem; font-weight: 800; text-align: left; display: flex; gap: 12px; align-items: center; box-shadow: 0 5px 0 #0006; min-height: 64px; }
.answer:active { transform: translateY(3px); box-shadow: 0 2px 0 #0006; }
.powers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.power { border-radius: 14px; padding: 12px; font-weight: 800; background: var(--panel); border: 2px solid var(--line); }
.power.on { border-color: var(--yellow); box-shadow: 0 0 18px #ffd23f66; }
.frozen { position: fixed; inset: 0; z-index: 15; display: grid; place-items: center; text-align: center; align-content: center; gap: 10px; background: #2de2e6cc; color: #0b2a3a; backdrop-filter: blur(6px); font-weight: 800; }
.frozen .huge { animation: pulse .5s infinite; }
.frozen .secs { font-family: Bungee, sans-serif; font-size: 3rem; }
.result-delta { font-family: Bungee, sans-serif; font-size: 3rem; }
.phone-wheel .wheel-wrap { width: min(78vw, 46vh); }
.phone-wheel .wheel .seg span { font-size: .62rem; }
.phone-wheel .mod-reveal .m-label { font-size: 1.8rem; }
.phone-wheel .mod-reveal .m-desc { font-size: 1rem; }
.correct-card { width: 100%; justify-content: center; font-size: 1.3rem; box-shadow: 0 0 0 3px #fff, 0 0 30px #3ef08a88; }
/* host modes */
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 760px) { .modes { grid-template-columns: 1fr; } }
.modecard { text-align: left; background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 16px 18px; display: grid; gap: 4px; }
.modecard b { font-family: Bungee, sans-serif; font-size: 1.1rem; }
.modecard.on { border-color: var(--yellow); box-shadow: 0 0 24px #ffd23f44; }
.modeopts { display: grid; gap: 12px; }
.settings { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.settings select { font: inherit; color: var(--ink); background: #0008; border: 2px solid var(--line); border-radius: 10px; padding: 6px 10px; }
.mods { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
input[type="checkbox"] { width: auto; accent-color: var(--yellow); margin: 0 4px 0 0; vertical-align: middle; }
.modchip input { display: none; }
.modchip { border: 2px solid var(--c); border-radius: 999px; padding: 4px 12px 4px 8px; font-weight: 600; font-size: .9rem; cursor: pointer; }
.modchip:has(input:not(:checked)) { opacity: .4; border-style: dashed; }
.hostname { max-width: 320px; }
#mybar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; display: none; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; padding: 12px 16px; background: #0d0820f2; border-top: 2px solid var(--yellow); }
body.playing #mybar { display: flex; }
body.playing .host { padding-bottom: 130px; }
body.playing #toasts { bottom: 140px; }
body.playing .tile { cursor: pointer; transition: transform .1s, filter .1s; }
body.playing .tile:hover { transform: translateY(-3px); filter: brightness(1.12); }
body.playing.locked .tile { cursor: default; transform: none; filter: saturate(.6); }
#mybar .who { font-weight: 800; color: var(--yellow); }
#mybar .answer { min-height: 48px; padding: 10px 16px; font-size: 1rem; }
#mybar .power { padding: 8px 12px; }
#mybar .frz { background: var(--cyan); color: #0b2a3a; border-radius: 12px; padding: 10px 16px; font-weight: 800; }
/* host corner tools: sound, control panel, close room */
#hosttools { position: fixed; left: 16px; bottom: 16px; z-index: 11; display: none; gap: 8px; }
body.is-host #hosttools { display: flex; }
body.playing #hosttools { bottom: 96px; }
#hosttools button { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; font-size: .9rem; color: var(--muted); }
#hosttools button:hover { color: var(--ink); background: var(--surface-2); }
#hosttools .danger:hover { color: var(--red); }
#cpbtn { display: none; }
body.gm-host #cpbtn { display: block; }
.panel { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; display: grid; gap: 16px; }
.panel h1 { margin: 0; font-size: 1.4rem; }
.panel .row { display: flex; gap: 10px; flex-wrap: wrap; }
.panel .opt { padding: 4px 0; }
.panel .opt.right { color: var(--green); font-weight: 800; }
.qrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding: 8px 0; }
.qrow small { color: var(--green); }
#padd { min-height: 120px; font-family: ui-monospace, monospace; font-size: .9rem; }
/* question editor */
.qlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 12px; margin: 10px 0; }
.qcard { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 8px; align-content: start; }
.qcard.bad { border-color: var(--red); }
.qcard .bad-msg { display: none; color: var(--red); font-size: .8rem; }
.qcard.bad .bad-msg { display: block; }
.qhead { display: flex; align-items: center; gap: 6px; }
.qnum { font-family: Bungee, sans-serif; color: var(--muted); min-width: 26px; }
.grow { flex: 1; }
.seg2 { display: flex; background: #0006; border-radius: 10px; padding: 2px; }
.seg2 button { background: none; padding: 4px 10px; border-radius: 8px; font-weight: 600; font-size: .85rem; color: var(--muted); }
.seg2 button.on { background: var(--line); color: var(--ink); }
.icon { background: none; width: 30px; height: 30px; border-radius: 8px; color: var(--muted); }
.icon:hover { background: var(--line); color: var(--ink); }
.qcard input { padding: 8px 10px; border-radius: 10px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
@media (max-width: 480px) { .opts { grid-template-columns: 1fr; } }
.optrow { display: flex; gap: 6px; align-items: center; }

/* desktop players: a roomier controller instead of a stretched phone */
@media (min-width: 760px) {
  .phone { max-width: 900px; padding: 28px 32px 120px; gap: 18px; }
  .me { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 10px 16px; }

  .powers { max-width: 560px; width: 100%; align-self: center; }
  .phone .center { flex: none; align-self: center; width: min(100%, 560px); margin-top: 6vh; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 36px 32px; }
  .reacts { left: 50%; right: auto; bottom: 16px; transform: translateX(-50%); border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; background: var(--surface); }
}
@media (min-width: 760px) and (hover: hover) { .answer kbd { display: inline-block; } }
/* chaos rounds */
.fx-blurry .qtext, .fx-blurry .otext { animation: unblur calc(var(--dur) * .6) linear var(--late) both; }
@keyframes unblur { from { filter: blur(14px); } 75% { filter: blur(3px); } to { filter: blur(0); } }
.fx-wobbly .answer, .fx-wobbly .tile { animation: drift1 2.3s ease-in-out var(--late) infinite; }
.fx-wobbly .answer:nth-child(2n), .fx-wobbly .tile:nth-child(2n) { animation-name: drift2; animation-duration: 1.9s; }
.fx-wobbly .answer:nth-child(3n), .fx-wobbly .tile:nth-child(3n) { animation-name: drift3; animation-duration: 2.7s; }
@keyframes drift1 { 25% { transform: translate(22px, -10px) rotate(4deg); } 50% { transform: translate(-6px, 14px) rotate(-3deg); } 75% { transform: translate(-24px, -6px) rotate(5deg); } }
@keyframes drift2 { 25% { transform: translate(-18px, 12px) rotate(-5deg); } 50% { transform: translate(20px, 4px) rotate(3deg); } 75% { transform: translate(4px, -16px) rotate(-2deg); } }
@keyframes drift3 { 33% { transform: translate(14px, 16px) rotate(6deg) scale(.95); } 66% { transform: translate(-20px, -8px) rotate(-4deg) scale(1.05); } }
.fog { position: fixed; inset: 0; z-index: 14; pointer-events: none; backdrop-filter: blur(7px); display: grid; place-items: start center; padding-top: 18px;
  background: radial-gradient(circle at 20% 30%, #9a8a7acc 0 14%, transparent 30%), radial-gradient(circle at 75% 55%, #8a7f70cc 0 16%, transparent 34%), radial-gradient(circle at 40% 80%, #a3968599 0 12%, transparent 28%), radial-gradient(circle at 85% 15%, #7d736899 0 10%, transparent 24%), #6b5f5244; }
.fog span { background: #120a26dd; border-radius: 999px; padding: 8px 16px; font-weight: 800; }
.roast { text-align: center; font-size: clamp(1rem, 1.8vw, 1.3rem); font-style: italic; color: var(--yellow); margin: -6px 0 0; }
.awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 12px; width: min(1100px, 100%); }
.award { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 14px 16px; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: center; text-align: left; animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) both; }
.award .ae { grid-row: span 3; font-size: 2.4rem; }
.award b { font-family: Bungee, sans-serif; font-size: .95rem; color: var(--yellow); }
.award .who { font-weight: 800; font-size: 1.1rem; }
.award small { color: var(--muted); }
.phone .awards { width: 100%; }
.reacts button { font-size: 1.7rem; background: none; padding: 4px 6px; border-radius: 10px; }
.reacts button:active { transform: scale(1.4); }
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>
<div id="conn">reconnecting…</div>
<div id="mybar"></div>
<div id="hosttools">
  <button id="mutebtn" title="Sound on/off"></button>
  <button data-invite title="Copy the join link">🔗 Invite</button>
  <button id="cpbtn">🎛️ Control panel</button>
  <button class="danger" data-close-room>✕ Close room</button>
</div>
<script>
const DEFAULT_QUESTIONS = `# "? question" then options, * marks the right one (2-4 options)
# "vote: prompt" = everyone votes for a teammate. Majority wins points.

? How many hearts does an octopus have?
1
2
*3
8

? Bananas are technically a…
*Berry
Nut
Legume
Herb

? What colour is a polar bear's skin?
White
Pink
*Black
Grey

vote: Who would survive the longest in a zombie apocalypse?

? Which country has the most time zones (counting its territories)?
Russia
USA
*France
UK

? What is the national animal of Scotland?
Lion

2005

2009

vote: Who is most likely to push straight to main on a Friday?

? A group of flamingos is called a…
*Flamboyance
Parade
Blush
Pinkery

? How long did the shortest war in history last?
*About 38 minutes
6 hours
3 days
2 weeks

186
*206
226
250

vote: Who has the most browser tabs open right now?

? Which planet has the most known moons?
Jupiter
*Saturn
Uranus
Neptune

? Which of these was invented first?
*Fax machine
Telephone
Light bulb
Radio

? What is 0.1 + 0.2 in JavaScript?
0.3
*0.30000000000000004
0.30000000000000001
NaN

vote: Who is most likely to become famous one day?

? The first literal computer "bug", found in 1947, was a…
*Moth
Cockroach
Spider
Fly

? What is the most spoken native language in the world?
English
Spanish
Hindi
*Mandarin Chinese

vote: Who is the MVP of this sprint?

vote: Who has the most unread Slack messages right now?

vote: Who is most likely to say "quick question" and take an hour?

vote: Who would accidentally join a meeting with the camera on in bed?

vote: Who is most likely to fix a bug by deleting the test?

vote: Who would last the shortest on a desert island?

vote: Who is secretly running the company?

vote: Who is most likely to still be on mute when it's their turn?
`;

const COLORS = ["#ff3d6e", "#2d8cff", "#ffb020", "#22c55e", "#a855f7", "#14b8a6", "#f97316", "#ec4899", "#84cc16", "#06b6d4"];
const SHAPES = ["▲", "◆", "●", "■", "★", "✚", "⬟", "♥", "☀", "☾"];
const REACTIONS = ["🔥", "😂", "👏", "😱", "💀", "🎉", "🤡", "🧠"];

const $ = (s) => document.querySelector(s);
const app = $("#app");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const params = new URLSearchParams(location.search);
// GitHub Pages only serves the page; rooms live on the Cloudflare Worker.
const API = location.hostname.endsWith("github.io") ? "https://retro-rumble.zancato-t.workers.dev" : location.origin;

let endTimer = 0;
let ws = null, role = null, room = null, state = null, offset = 0, lastKey = "", seenPlayers = new Set();
let mine = null, mineState = null, mineFrozen = false; // the host's own player seat in Play-along mode
const SECONDS = [15, 20, 30, 45, 60];
const serverNow = () => Date.now() + offset;

/* ---------- sound (host only) ---------- */
let audio = null;
function unlockAudio() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
  audio?.resume?.();
}
document.addEventListener("pointerdown", () => role === "host" && unlockAudio());
let muted = store.get("rr-mute") === "1";
const canPlay = () => audio && role === "host" && !muted;
function beep(freq, dur = 0.12, type = "square", vol = 0.05, when = 0) {
  if (!canPlay()) return;
  const t = audio.currentTime + when, o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  join: () => { beep(660, 0.08, "triangle", 0.08); beep(990, 0.1, "triangle", 0.08, 0.07); },
  click: () => beep(1400, 0.03, "triangle", 0.05),
  mod: () => [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.18, "square", 0.05, i * 0.09)),
  reveal: () => [392, 523, 659, 784].forEach((f, i) => beep(f, 0.4, "sawtooth", 0.03, i * 0.04)),
  ice: () => [2000, 1600, 2400].forEach((f, i) => beep(f, 0.08, "sine", 0.06, i * 0.05)),
  fanfare: () => [523, 523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => beep(f, 0.22, "square", 0.05, i * 0.14)),
};

// The thinking clock: original woodblock tick-tock with a bass thump, faster and higher in the last 10s.
function woodblock(freq, vol) {
  if (!canPlay()) return;
  const t = audio.currentTime, o = audio.createOscillator(), f = audio.createBiquadFilter(), g = audio.createGain();
  o.type = "triangle";
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * 0.6, t + 0.05);
  f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 3;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
  o.connect(f).connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.1);
}
function thump(vol = 0.18) {
  if (!canPlay()) return;
  const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.18);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.3);
}
function buzzer() {
  if (!canPlay()) return;
  const t = audio.currentTime, f = audio.createBiquadFilter(), g = audio.createGain();
  f.type = "lowpass"; f.frequency.value = 1100;
  g.gain.setValueAtTime(0.14, t); g.gain.setValueAtTime(0.14, t + 0.55); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.95);
  f.connect(g).connect(audio.destination);
  for (const d of [0, 7]) {
    const o = audio.createOscillator();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(150 + d, t); o.frequency.exponentialRampToValueAtTime(62 + d, t + 0.9);
    o.connect(f); o.start(t); o.stop(t + 1);
  }
}
let clockKey = "", clockBeat = 0, buzzedFor = -1;
function clockFrame(left) {
  if (left <= 0) {
    if (buzzedFor !== state.qi) { buzzedFor = state.qi; buzzer(); }
    return;
  }
  const elapsed = state.duration - left;
  const final = left <= 10000;
  const key = final ? `f${Math.floor((10000 - left) / 500)}` : `n${Math.floor(elapsed / 1000)}`;
  if (key === clockKey) return;
  clockKey = key;
  const tick = clockBeat++ % 2 === 0;
  if (final) {
    const rise = (10000 - left) / 10000; // 0 → 1 over the last 10s
    woodblock((tick ? 1500 : 1150) * (1 + rise * 0.6), 0.16 + rise * 0.08);
    if (tick) thump(0.14 + rise * 0.1);
  } else {
    woodblock(tick ? 1500 : 1150, 0.13);
    if (tick) thump();
  }
}

/* ---------- fx ---------- */
function toast(text) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = text;
  $("#toasts").append(el);
  setTimeout(() => el.remove(), 3200);
  if (text.includes("🧊")) sfx.ice();
}
function floatReact(e) {
  const el = document.createElement("div");
  el.className = "float"; el.textContent = e;
  el.style.left = 5 + Math.random() * 90 + "vw";
  el.style.setProperty("--r", (Math.random() * 80 - 40) + "deg");
  document.body.append(el);
  setTimeout(() => el.remove(), 2700);
}
function confetti() {
  const c = document.createElement("canvas"); c.id = "confetti"; document.body.append(c);
  const ctx = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const bits = Array.from({ length: 220 }, () => ({
    x: Math.random() * c.width, y: -20 - Math.random() * c.height, vy: 2 + Math.random() * 4, vx: Math.random() * 2 - 1,
    r: Math.random() * 6, s: 6 + Math.random() * 8, col: COLORS[Math.floor(Math.random() * COLORS.length)],
  }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, c.width, c.height);
    for (const b of bits) {
      b.y += b.vy; b.x += b.vx + Math.sin((t + b.y) / 300); b.r += 0.1;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.col; ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); ctx.restore();
    }
    if (t - t0 < 7000) requestAnimationFrame(frame); else c.remove();
  })(t0);
}
function countUp(el, from, to, ms = 1100) {
  const t0 = performance.now();
  (function f(t) {
    const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(f);
  })(t0);
}

/* ---------- connection ---------- */
function connect() {
  const api = new URL(API);
  const proto = api.protocol === "https:" ? "wss" : "ws";
  const q = role === "host" || role === "panel"
    ? `role=host&key=${encodeURIComponent(store.get("rr-host-" + room) || "")}`
    : `role=player&pid=${encodeURIComponent(myId())}&name=${encodeURIComponent(store.get("rr-name") || "")}`;
  ws = new WebSocket(`${proto}://${api.host}/ws/${room}?${q}`);
  ws.onopen = () => { $("#conn").style.display = "none"; };
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.t === "state") { offset = msg.now - Date.now(); state = msg; render(); }
    else if (msg.t === "event") toast(msg.text);
    else if (msg.t === "react") floatReact(msg.e);
  };
  ws.onclose = (ev) => {
    if (ev.code === 4004 || ev.code === 4003 || ev.code === 4005) {
      toast({ 4004: "That room doesn't exist (anymore)", 4003: "You're not the host of that room", 4005: "The host closed the room" }[ev.code]);
      if (role !== "player") { store.set("rr-host-" + room, ""); store.set("rr-hostplayer-" + room, ""); }
      try { mine?.close(); } catch {}
      mine = null; mineState = null;
      document.body.classList.remove("playing", "gm-host", "locked");
      history.replaceState(null, "", location.pathname);
      role = null; state = null; lastKey = "";
      return landing();
    }
    if (ev.code === 4001) return toast("You joined from somewhere else, this tab is now inactive");
    $("#conn").style.display = "block";
    setTimeout(connect, 1200);
  };
}
const sendMsg = (m) => ws?.readyState === 1 && ws.send(JSON.stringify(m));
function myId() {
  // Per tab, so several tabs on one PC are separate players (a reload keeps the same one).
  let id = null;
  try { id = sessionStorage.getItem("rr-pid"); } catch {}
  if (!id) {
    id = crypto.randomUUID?.() || String(Math.random()).slice(2);
    try { sessionStorage.setItem("rr-pid", id); } catch {}
  }
  return id;
}

/* ---------- landing ---------- */
function landing() {
  app.className = "";
  app.innerHTML = `
    <div class="landing">
      <h1 class="brand">RETRO<br>RUMBLE</h1>
      <p class="tag muted">The sprint is over. Settle the score.</p>
      <form class="card" id="join">
        <h2>Join a game</h2>
        <input id="code" maxlength="4" placeholder="CODE" autocomplete="off" value="${esc((params.get("room") || "").toUpperCase())}">
        <input id="name" maxlength="16" placeholder="Your name" autocomplete="off" value="${esc(store.get("rr-name") || "")}">
        <button class="big">Jump in ▶</button>
      </form>
      <div class="card">
        <h2>Running the retro?</h2>
        <p class="muted" style="margin:0">Host on the screen you're sharing. Everyone else plays from their phone.</p>
        <button class="ghost" id="host">🎡 Host a game</button>
      </div>
    </div>`;
  $("#join").onsubmit = (e) => {
    e.preventDefault();
    const code = $("#code").value.trim().toUpperCase(), name = $("#name").value.trim();
    if (!/^[A-Z]{4}$/.test(code)) return toast("Room codes are 4 letters");
    if (!name) return toast("Pick a name");
    store.set("rr-name", name);
    room = code; role = "player";
    history.replaceState(null, "", `?room=${code}`);
    connect();
  };
  $("#host").onclick = async () => {
    unlockAudio();
    const res = await fetch(`${API}/api/room`, { method: "POST" });
    if (!res.ok) return toast("Couldn't create a room");
    const { code, hostKey } = await res.json();
    store.set("rr-host-" + code, hostKey);
    room = code; role = "host";
    history.replaceState(null, "", `?host=${code}`);
    connect();
  };
}

/* ---------- render ---------- */
function render() {
  const key = `${state.role}|${state.phase}|${state.qi}`;
  const fresh = key !== lastKey;
  lastKey = key;
  app.className = fresh ? "fresh" : "";
  if (role === "panel") renderPanel();
  else if (state.role === "host") renderHost(fresh);
  else renderPlayer(fresh);
  document.body.classList.toggle("is-host", role === "host");
  if (role === "host") {
    document.body.classList.toggle("gm-host", state.mode === "gm" && state.phase !== "lobby");
    renderMine();
  }
  if (fresh) setTimeout(() => app.classList.remove("fresh"), 1200);
}

function wheelHTML(s) {
  const seg = 360 / s.wheel.length;
  const grad = s.wheel.map((m, i) => `${m.color} ${i * seg}deg ${(i + 1) * seg}deg`).join(",");
  return `
    <div class="wheel-stage">
      <div class="wheel-wrap">
        <div class="pointer">▼</div>
        <div class="wheel" id="wheel" style="background-image:conic-gradient(${grad})">
          ${s.wheel.map((m, i) => `<div class="seg" style="transform:rotate(${(i + 0.5) * seg}deg)"><span><b>${m.emoji}</b>${esc(m.label)}</span></div>`).join("")}
        </div>
        <div class="hub">🎡</div>
      </div>
      <div class="mod-reveal" id="modReveal"></div>
    </div>`;
}
function spinWheel(s) {
  const seg = 360 / s.wheel.length;
  const target = 360 * 6 + (360 - (s.modIndex + 0.5) * seg) + (Math.random() - 0.5) * seg * 0.6;
  requestAnimationFrame(() => requestAnimationFrame(() => { const w = $("#wheel"); if (w) w.style.transform = `rotate(${target}deg)`; }));
  const N = 34;
  for (let k = 0; k < N; k++) setTimeout(sfx.click, 4200 * (1 - Math.cbrt(1 - k / N)));
  setTimeout(() => {
    const el = $("#modReveal");
    if (!el) return;
    el.innerHTML = `<span class="m-emoji">${s.mod.emoji}</span><div class="m-label" style="color:${s.mod.color}">${esc(s.mod.label)}</div><div class="m-desc">${esc(s.mod.desc)}</div>`;
    sfx.mod();
    navigator.vibrate?.(50);
  }, 4300);
}

const tileStyle = (i) => `background:${COLORS[i % COLORS.length]}`;
const colorVar = (i) => `--c:${COLORS[i % COLORS.length]}`;
const shapeChip = (i) => `<span class="shape-chip">${SHAPES[i % SHAPES.length]}</span>`;
const modBadge = (m) => `<span class="modbadge" style="--c:${m.color}">${m.emoji} <b>${esc(m.label)}</b> <span>· ${esc(m.desc)}</span></span>`;
// Chaos rounds are just CSS on the question screen. --late keeps the animations in step across re-renders.
function fxAttrs(s) {
  const cls = { wobbly: "fx-wobbly", blurry: "fx-blurry" }[s.mod.id] || "";
  const late = -Math.max(0, serverNow() - (s.deadline - s.duration));
  return `class="${cls}" style="--dur:${s.duration}ms;--late:${late}ms"`;
}
const PRANK_INFO = {
  ice: ["🧊", "Ice the leader", "freeze them 5s"],
  banana: ["🍌", "Banana", "shuffle someone's buttons"],
  fog: ["🌫️", "Fog", "smear someone's screen"],
  swap: ["🔄", "Swap", "trade answers at the reveal"],
};
const qcount = (s) => `<span class="qcount"><b>Question ${s.qi + 1}</b> of ${s.total}</span>`;

function renderHost(fresh) {
  const s = state;
  if (s.phase === "lobby") {
    if (fresh) {
      const joinUrl = inviteUrl();
      let settings = s.settings;
      try { settings = { ...settings, ...JSON.parse(store.get("rr-settings") || "{}") }; } catch {}
      app.innerHTML = `
        <div class="host">
          <h1 class="brand">RETRO RUMBLE</h1>
          <div class="lobby-grid">

      });
      $("#qappend").onclick = () => {
        const parsed = parseQs($("#qtext").value);
        if (!parsed.length) return toast("Couldn't read any questions from that text");

        editor.set([...model, ...add]);
        $("#qtext").value = "";
        toast(addedMsg(add.length, parsed.length - add.length));
      };
      $("#otdbAdd").onclick = async () => {
        const fetched = await withCooldown($("#otdbAdd"), () => fetchTrivia(10, $("#otdbCat").value, $("#otdbDiff").value));
        if (!fetched.length) return toast("Open Trivia DB didn't answer. Try again in a few seconds, or another category");
        const add = dedupe(fetched, model.map((q) => q.text));
        editor.set([...model, ...add]);
        toast(addedMsg(add.length, fetched.length - add.length));
      };
      $("#qreset").onclick = (e) => { e.preventDefault(); if (confirm("Replace your questions with the default set?")) editor.set(parseQs(DEFAULT_QUESTIONS)); };
      $("#lobbySettings").onchange = () => store.set("rr-settings", JSON.stringify(readSettings($("#lobbySettings"))));
      document.querySelectorAll(".modecard").forEach((b) => (b.onclick = () => { store.set("rr-mode", b.dataset.mode); renderHost(false); }));
      $("#hostname").oninput = () => renderHost(false);
      $("#start").onclick = () => {
        unlockAudio();
        if (lobbyMode() === "play") {
          const name = $("#hostname").value.trim();
          store.set("rr-name", name);
          store.set("rr-hostplayer-" + room, name);
          connectMine(() => sendMsg({ t: "start", mode: "play", questions: DEFAULT_QUESTIONS }));
        } else {
          if (!model.some(qValid)) return toast("Add at least one finished question");
          sendMsg({ t: "start", mode: "gm", questions: serializeQs(model), settings: readSettings($("#lobbySettings")) });
        }
      };
      seenPlayers = new Set();
    }
    const n = s.players.length, mode = lobbyMode();
    document.querySelectorAll(".modecard").forEach((b) => b.classList.toggle("on", b.dataset.mode === mode));
    document.querySelectorAll(".modeopts").forEach((el) => (el.style.display = el.dataset.for === mode ? "" : "none"));
    $("#pcount").textContent = n ? `${n} player${n > 1 ? "s" : ""} in` : "Waiting for players…";
    $("#bubbles").innerHTML = s.players.map((p) => `<div class="bubble ${p.connected ? "" : "off"}"><span class="av" style="animation-delay:-${Math.random() * 2}s">${p.emoji}</span>${esc(p.name)}</div>`).join("");
    if (s.players.some((p) => !seenPlayers.has(p.id))) sfx.join();
    seenPlayers = new Set(s.players.map((p) => p.id));
    const hostName = $("#hostname").value.trim();
    // Someone else has to be here; the host's own seat in Play along joins at start.
    const ready = n > 0 && (mode !== "play" || !!hostName);
    $("#start").disabled = !ready;
    $("#start").textContent = ready ? "Let's rumble ▶" : n === 0 ? "Waiting for a player to join…" : "Enter your name to play";
    return;
  }

  if (s.phase === "spin") {
    if (!fresh) return;
    app.innerHTML = `
      <div class="host">
        <div class="topbar">${qcount(s)}<span class="muted">${s.q.kind === "vote" ? "🗳️ Team vote" : "🧠 Quiz"}</span></div>
        ${wheelHTML(s)}
      </div>`;
    spinWheel(s);
    return;
  }

  if (s.phase === "question") {
    if (fresh) {
      app.innerHTML = `
        <div class="host">
          <div class="topbar">${qcount(s)}${modBadge(s.mod)}</div>
          <div ${fxAttrs(s)}>
            <h1 class="qtext pop">${esc(s.q.text)}</h1>
          </div>
          <div class="timer"><div class="timer-fill"></div><span class="timer-num"></span></div>
          <div ${fxAttrs(s)}><div class="tiles ${s.q.options.length <= 4 ? "four" : ""}">
            ${s.q.options.map((o, i) => `<div class="tile pop" data-i="${i}" style="${colorVar(i)}">${shapeChip(i)}<span class="otext">${esc(o)}</span></div>`).join("")}
          </div></div>
          <div class="live" id="live"></div>
          <div class="host-foot"><button class="ghost" id="skip">Reveal now ⏭</button></div>
        </div>`;
      $("#skip").onclick = () => sendMsg({ t: "skip" });
      // Play along: the host answers by clicking the cards themselves.
      document.querySelectorAll(".tile[data-i]").forEach((t) => (t.onclick = () => {
        const me = mineState?.me;
        if (state.mode !== "play" || mineState?.phase !== "question" || !me || me.answer !== null || mineFrozen) return;
        sendMine({ t: "answer", i: +t.dataset.i });
      }));
    }
    const live = s.players.filter((p) => p.connected);
    const done = s.players.filter((p) => p.answered);
    $("#live").innerHTML = `<span class="count">${done.length}/${live.length}</span><span class="muted">locked in</span>` +
      done.map((p) => `<span class="in ${p.allIn ? "allin" : ""}" title="${esc(p.name)}">${p.emoji}</span>`).join("");
    return;
  }

  if (s.phase === "reveal") {
    if (!fresh) return;
    const r = s.reveal;
    const last = s.qi + 1 >= s.total;
    const vote = s.q.kind === "vote";
    const byId = Object.fromEntries(s.players.map((p) => [p.id, p]));
    const pickers = (i) => Object.entries(r.picks).filter(([, a]) => a === i).map(([id]) => byId[id]).filter(Boolean);
    const pill = r.winners.length
      ? `<span class="pill" style="${colorVar(r.winners[0])}"><small>${vote ? (s.mod.id === "contrarian" ? "🙃 Least picked" : "🗳️ Team picked") : "✔ Answer"}</small>${r.winners.map((i) => esc(s.q.options[i])).join(" &amp; ")}</span>`
      : "";
    app.innerHTML = `
      <div class="host">
        <div class="topbar">${qcount(s)}${modBadge(s.mod)}</div>
        <h2 class="qtext small">${esc(s.q.text)}</h2>
        <div class="verdict pop">${pill}<span>${esc(r.headline)}</span></div>
        ${r.roast ? `<p class="roast pop">${esc(r.roast)}</p>` : ""}
        <div class="reveal-grid">
          <div class="rtiles ${s.q.options.length <= 4 ? "four" : ""}">
            ${s.q.options.map((o, i) => {
              const who = pickers(i);
              return `<div class="rtile pop ${r.winners.includes(i) ? "win" : "lose"}" style="${colorVar(i)}">
                <div class="rt-top">${shapeChip(i)}<span class="rt-text">${esc(o)}</span><span class="rt-count">${r.counts[i]}</span></div>
                <div class="rt-who">${who.map((p) => `<span title="${esc(p.name)}">${p.emoji}<small>${esc(p.name)}</small></span>`).join("") || `<span class="rt-none">nobody</span>`}</div>
              </div>`;
            }).join("")}
          </div>
          <div class="board">
            <div class="board-title">Leaderboard</div>
            ${s.players.slice(0, 8).map((p) => {
              const res = r.results[p.id] || { delta: 0, note: "" };
              const before = r.rankBefore[p.id], moved = before ? before - p.rank : 0;
              const note = res.note || (r.picks[p.id] == null ? "no answer" : "");
              return `<div class="brow pop">
                <span class="rk">${["🥇", "🥈", "🥉"][p.rank - 1] || p.rank}</span><span class="av">${p.emoji}</span>
                <span class="nm">${esc(p.name)} ${p.streak >= 3 ? "🔥" : ""} ${moved > 0 ? `<span class="up">▲${moved}</span>` : moved < 0 ? `<span class="down">▼${-moved}</span>` : ""}${note ? `<span class="nt">${esc(note)}</span>` : ""}</span>
                <span class="delta ${res.delta > 0 ? "up" : res.delta < 0 ? "down" : "zero"}">${res.delta > 0 ? "+" : ""}${res.delta}</span>
                <span class="sc" data-from="${p.score - res.delta}" data-to="${p.score}">${p.score - res.delta}</span>
              </div>`;
            }).join("")}
          </div>
        </div>
        <div class="host-foot"><button class="big" id="next">${last ? "Final results 🏆" : "Next ▶"}</button></div>
      </div>`;
    sfx.reveal();
    setTimeout(() => document.querySelectorAll(".sc").forEach((el) => countUp(el, +el.dataset.from, +el.dataset.to)), 700);
    $("#next").onclick = () => sendMsg({ t: "next" });
    return;
  }

  if (s.phase === "end") {
    if (!fresh) return;
    clearTimeout(endTimer);
    // Awards first, one card at a time, then the podium.
    const podium = () => {
      clearTimeout(endTimer);
      if (state?.phase !== "end") return;
      const [a, b, c] = state.players;
      const col = (p, cls, n) => p ? `<div class="col ${cls}"><span class="av">${p.emoji}</span><span class="nm">${esc(p.name)}</span><span class="muted">${p.score}</span><div class="block">${n}</div></div>` : "";
      app.innerHTML = `
        <div class="host end">
          <h1 class="brand">CHAMPIONS</h1>
          <div class="podium">${col(b, "p2", 2)}${col(a, "p1", 1)}${col(c, "p3", 3)}</div>
          <div class="rest">${state.players.slice(3).map((p) => `${p.rank}. ${p.emoji} ${esc(p.name)} · ${p.score}`).join(" &nbsp;·&nbsp; ")}</div>
          <div class="lobby-actions">${state.awards.length ? `<button class="ghost" id="reawards">🏅 Awards again</button>` : ""}<button class="big" id="again">Run it back 🔁</button></div>
        </div>`;
      sfx.fanfare();
      setTimeout(confetti, 1300);
      $("#again").onclick = () => sendMsg({ t: "again" });
      $("#reawards") && ($("#reawards").onclick = awards);
    };
    const awards = () => {
      const list = state.awards.slice(0, 12);
      if (!list.length) return podium();
      app.innerHTML = `
        <div class="host end">
          <h1 class="brand">SPECIAL AWARDS</h1>
          <div class="awards">${list.map((a, k) => {
            const p = state.players.find((x) => x.id === a.id);
            return p ? `<div class="award" style="animation-delay:${0.5 + k * 0.8}s"><span class="ae">${a.emoji}</span><b>${esc(a.title)}</b><span class="who">${p.emoji} ${esc(p.name)}</span><small>${esc(a.desc)}</small></div>` : "";
          }).join("")}</div>
          <button class="big" id="topodium">And the winner is… 🏆</button>
        </div>`;
      $("#topodium").onclick = podium;
      endTimer = setTimeout(podium, 4500 + list.length * 800);
    };
    awards();
  }
}

function renderPlayer(fresh) {
  const s = state, me = s.me;
  if (s.phase === "spin" && !fresh) return;
  const head = `<div class="me"><span class="av">${me.emoji}</span>${esc(me.name)}${s.phase !== "lobby" ? `<span class="rank">#${me.rank} of ${s.playerCount}</span>` : ""}<span class="sc">${me.score}</span></div>`;
  const reacts = `<div class="reacts">${REACTIONS.map((e) => `<button data-e="${e}">${e}</button>`).join("")}</div>`;
  let body = "";

  if (s.phase === "lobby") {
    body = `<div class="center"><div class="huge pop" style="animation:wobble 2s infinite">${me.emoji}</div><h2 class="display pop">You're in!</h2>
      <p class="muted">Eyes on the shared screen. ${s.playerCount} player${s.playerCount > 1 ? "s" : ""} so far.</p>
      ${s.powerups ? `<p class="muted">🎲 <b>All-in</b> once per game, plus a prank card: ${PRANK_INFO[me.prank]?.[0] ?? "🃏"} <b>${esc(PRANK_INFO[me.prank]?.[1] ?? "a prank")}</b>. Used cards get refilled every few questions.</p>` : ""}</div>`;
  } else if (s.phase === "spin") {
    body = `<div class="phone-wheel">${wheelHTML(s)}</div>`;
  } else if (s.phase === "question" && s.q) {
    const answered = me.answer !== null;
    const pickedText = answered ? s.q.options.find((o) => o.i === me.answer)?.text : "";
    // Banana'd buttons colour by position, so they stop matching the big screen.
    const byPos = me.banana;
    const pr = PRANK_INFO[me.prank];
    body = `
      ${modBadge(s.mod)}
      <div ${fxAttrs(s)}><h2 class="qtext">${esc(s.q.text)}</h2></div>
      <div class="timer"><div class="timer-fill"></div><span class="timer-num"></span></div>
      ${answered
        ? `<div class="center"><div class="huge">🤞</div><h2 class="display">Locked in</h2><p>${esc(pickedText)}</p>${me.allInActive ? `<p class="up"><b>🎲 ALL-IN</b></p>` : ""}</div>`
        : `<div ${fxAttrs(s)}><div class="answers ${s.q.options.length > 4 ? "many" : ""}">
            ${s.q.options.map((o, pos) => `<button class="answer ${fresh ? "pop" : ""}" data-i="${o.i}" style="${tileStyle(byPos ? pos : o.i)}"><span>${SHAPES[(byPos ? pos : o.i) % SHAPES.length]}</span><span class="otext">${esc(o.text)}</span>${pos < 9 ? `<kbd>${pos + 1}</kbd>` : ""}</button>`).join("")}
          </div></div>`}
      ${!s.powerups ? "" : `<div class="powers">
        <button class="power ${me.allInActive ? "on" : ""}" id="allin" ${me.allInUsed || answered ? "disabled" : ""}>🎲 ${me.allInActive ? "ALL-IN!" : "All-in"}<br><small class="muted">2× or −500</small></button>
        ${me.swapPending
          ? `<button class="power on" disabled>🔄 Swap armed<br><small class="muted">happens at the reveal</small></button>`
          : `<button class="power" id="prank" ${pr ? "" : "disabled"}>${pr ? `${pr[0]} ${pr[1]}<br><small class="muted">${pr[2]}</small>` : `🃏 No prank<br><small class="muted">refill soon</small>`}</button>`}
      </div>`}
      ${serverNow() < me.fogUntil ? `<div class="fog"><span>🌫️ ${esc(me.fogBy)} fogged your screen</span></div>` : ""}
      ${serverNow() < me.frozenUntil ? `<div class="frozen"><div class="huge">🧊</div><div>FROZEN by ${esc(me.frozenBy)}</div><div class="secs" id="fsecs"></div></div>` : ""}`;
  } else if (s.phase === "reveal") {
    const r = s.result || { delta: 0, correct: null, note: "" };
    const icon = r.correct === true ? "✅" : r.correct === false ? "❌" : r.delta > 0 ? "🗳️" : "😶";
    body = `<div class="center">
      <div class="huge pop">${icon}</div>
      <div class="result-delta pop ${r.delta > 0 ? "up" : r.delta < 0 ? "down" : "muted"}">${r.delta > 0 ? "+" : ""}${r.delta}</div>
      ${r.note ? `<p><b>${esc(r.note)}</b></p>` : ""}
      ${s.q && s.winners.length ? `
        <div class="muted">${s.q.kind === "vote" ? "The team picked" : "Correct answer"}</div>
        ${s.q.options.map((o, pos) => s.winners.includes(o.i) ? `<div class="answer correct-card pop" style="${tileStyle(me.banana ? pos : o.i)}"><span>${SHAPES[(me.banana ? pos : o.i) % SHAPES.length]}</span>${esc(o.text)}</div>` : "").join("")}
        ${me.answer !== null && !s.winners.includes(me.answer) ? `<p class="muted">You picked: <b>${esc(s.q.options.find((o) => o.i === me.answer)?.text ?? "")}</b></p>` : ""}` : ""}
      <h2 class="display">#${me.rank} <span class="muted">of ${s.playerCount}</span></h2>
    </div>`;
  } else if (s.phase === "end") {
    const medal = ["🥇", "🥈", "🥉"][me.rank - 1] || "🫡";
    body = `<div class="center"><div class="huge pop">${medal}</div><h2 class="display">#${me.rank} of ${s.playerCount}</h2><p class="result-delta">${me.score}</p>
      ${s.awards.length ? `<div class="awards">${s.awards.map((a) => `<div class="award"><span class="ae">${a.emoji}</span><b>${esc(a.title)}</b><small>${esc(a.desc)}</small></div>`).join("")}</div>` : ""}
      <p class="muted">GG. Now back to the action items.</p></div>`;
  }

  app.innerHTML = `<div class="phone">${head}${body}</div>${reacts}`;
  document.querySelectorAll(".answer").forEach((b) => (b.onclick = () => { navigator.vibrate?.(30); sendMsg({ t: "answer", i: +b.dataset.i }); }));
  document.querySelectorAll(".reacts button").forEach((b) => (b.onclick = () => sendMsg({ t: "react", e: b.dataset.e })));
  $("#allin") && ($("#allin").onclick = () => sendMsg({ t: "allin" }));
  $("#prank") && ($("#prank").onclick = () => sendMsg({ t: "prank" }));
  if ($(".frozen")) navigator.vibrate?.([80, 40, 80]);
  if (s.phase === "spin") spinWheel(s);
  if (s.phase === "reveal" && fresh) navigator.vibrate?.(s.result?.delta > 0 ? 60 : [40, 60, 40]);
}

/* ---------- Open Trivia DB (via the Worker) ---------- */
const OTDB_CATS = [["mix", "🎲 Friendly mix"], ["9", "General Knowledge"], ["17", "Science & Nature"], ["22", "Geography"], ["23", "History"], ["27", "Animals"],
  ["11", "Film"], ["12", "Music"], ["18", "Computers"], ["21", "Sports"], ["20", "Mythology"], ["10", "Books"], ["25", "Art"], ["28", "Vehicles"],
  ["14", "Television"], ["15", "Video Games"], ["31", "Anime & Manga"]];
// Open Trivia DB allows about one request per 5s, so a trivia button rests 5s from the press
// (longer if the fetch is still running) and shows the countdown.
async function withCooldown(btn, fn) {
  const label = btn.textContent, until = Date.now() + 5000;
  let busy = true;
  btn.disabled = true;
  btn.dataset.cooling = "1";
  (function tick() {
    const left = Math.ceil((until - Date.now()) / 1000);
    if (left <= 0 && !busy) {
      delete btn.dataset.cooling;
      btn.disabled = false;
      btn.textContent = label;
      return;
    }
    btn.textContent = left > 0 ? `${label} · ${left}s` : "🌐 Fetching…";
    setTimeout(tick, 200);
  })();
  try { return await fn(); } finally { busy = false; }
}
async function fetchTrivia(amount, category, difficulty) {
  try {
    const res = await fetch(`${API}/api/trivia?amount=${amount}&category=${category}&difficulty=${difficulty}`);
    const qs = res.ok ? await res.json() : [];
    return qs.map((q) => ({ ...q, options: [...q.options, "", "", "", ""].slice(0, 4) }));
  } catch { return []; }
}

/* ---------- question editor ---------- */
// Same duplicate check as the server: most meaningful words in common.
const STOPWORDS = new Set(["the", "and", "for", "are", "was", "were", "which", "what", "who", "this", "that", "with", "from", "these", "following", "has", "have", "does", "did", "how", "many", "much", "when", "where", "year", "name", "called"]);
const qwords = (t) => new Set(t.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, " ").split(/\s+/).filter((w) => (w.length > 2 || /\d|^[ivx]+$/.test(w)) && !STOPWORDS.has(w)));
function similar(a, b) {
  const x = qwords(a), y = qwords(b);
  if (!x.size || !y.size) return a.trim().toLowerCase() === b.trim().toLowerCase();
  let shared = 0;
  for (const w of x) if (y.has(w)) shared++;
  return shared / (x.size + y.size - shared) >= 0.75;
}
function dedupe(add, existing) {
  const seen = existing.filter((t) => t.trim());
  return add.filter((q) => {
    if (seen.some((t) => similar(t, q.text))) return false;
    seen.push(q.text);
    return true;
  });
}
const addedMsg = (n, skipped) => `➕ ${n} question${n === 1 ? "" : "s"} added${skipped ? ` (${skipped} duplicate${skipped > 1 ? "s" : ""} skipped)` : ""}`;
const blankQ = (kind = "quiz") => ({ kind, text: "", options: ["", "", "", ""], correct: 0 });
const qValid = (q) => !!q.text.trim() && (q.kind === "vote" || (q.options.filter((o) => o.trim()).length >= 2 && !!q.options[q.correct]?.trim()));

// Same text format the server reads: "? question", answer lines with * on the right one, "vote: prompt".
function parseQs(text) {
  const out = [];
  let cur = null;
  for (const raw of text.split("\n")) {
    const line = raw.trim();
    if (!line || line.startsWith("#")) continue;
    const vote = line.match(/^vote:\s*(.+)$/i);
    if (vote) { cur = null; out.push({ ...blankQ("vote"), text: vote[1] }); continue; }
    if (line.startsWith("?")) { cur = { kind: "quiz", text: line.slice(1).trim(), options: [], correct: -1 }; out.push(cur); continue; }
    if (cur && cur.options.length < 4) {
      if (line.startsWith("*")) cur.correct = cur.options.length;
      cur.options.push(line.replace(/^\*/, "").trim());
    }
  }
  for (const q of out) {
    while (q.options.length < 4) q.options.push("");
    if (q.correct < 0) q.correct = 0;
  }
  return out;
}
function serializeQs(model) {
  const clean = (t) => t.trim().replace(/^[?*#]+\s*/, "");
  return model.filter(qValid).map((q) => q.kind === "vote"
    ? `vote: ${q.text.trim()}`
    : [`? ${q.text.trim()}`, ...q.options.map((o, i) => [clean(o), i]).filter(([o]) => o).map(([o, i]) => (i === q.correct ? "*" : "") + o)].join("\n")
  ).join("\n\n");
}

function qcardHTML(q, n) {
  return `<div class="qcard ${qValid(q) ? "" : "bad"}" data-n="${n}">
    <div class="qhead">
      <span class="qnum">${n + 1}</span>
      <div class="seg2"><button data-kind="quiz" class="${q.kind === "quiz" ? "on" : ""}">🧠 Quiz</button><button data-kind="vote" class="${q.kind === "vote" ? "on" : ""}">🗳️ Vote</button></div>
      <span class="grow"></span>
      <button class="icon" data-act="up" title="Move up">↑</button><button class="icon" data-act="down" title="Move down">↓</button><button class="icon" data-act="del" title="Delete">✕</button>
    </div>
    <input data-f="text" maxlength="200" placeholder="${q.kind === "vote" ? "Who is most likely to…" : "Your question"}" value="${esc(q.text)}">
    ${q.kind === "vote"
      ? `<span class="muted" style="font-size:.85rem">Everyone votes for a teammate. The majority pick scores.</span>`
      : `<div class="opts">${q.options.map((o, i) => `<div class="optrow" style="--c:${COLORS[i]}"><button class="mark ${i === q.correct ? "on" : ""}" data-correct="${i}" title="Mark as the right answer">${i === q.correct ? "✔" : SHAPES[i]}</button><input data-opt="${i}" maxlength="80" placeholder="${i < 2 ? "Answer" : "Answer (optional)"}" value="${esc(o)}"></div>`).join("")}</div>`}
    <div class="bad-msg">${q.kind === "vote" ? "Needs a prompt" : "Needs a question, 2+ answers and a ✔ on a filled one"}</div>
  </div>`;
}

// Edits the model array in place; typing doesn't redraw (keeps focus), structural changes do.
function mountEditor(root, model, onChange) {
  const draw = () => {
    root.innerHTML = `<div class="qlist">${model.map(qcardHTML).join("")}</div>
      <div class="qtools"><button class="ghost" data-add="quiz">+ Quiz question</button><button class="ghost" data-add="vote">+ Team vote</button></div>`;
  };
  root.oninput = (e) => {
    const card = e.target.closest(".qcard");
    if (!card) return;
    const q = model[+card.dataset.n];
    if (e.target.dataset.f === "text") q.text = e.target.value;
    else if (e.target.dataset.opt != null) q.options[+e.target.dataset.opt] = e.target.value;
    card.classList.toggle("bad", !qValid(q));
    onChange(model);
  };
  root.onclick = (e) => {
    const b = e.target.closest("button");
    if (!b || !root.contains(b)) return;
    e.preventDefault();
    const n = +b.closest(".qcard")?.dataset.n;
    if (b.dataset.add) model.push(blankQ(b.dataset.add));
    else if (b.dataset.kind) model[n].kind = b.dataset.kind;
    else if (b.dataset.correct != null) model[n].correct = +b.dataset.correct;
    else if (b.dataset.act === "del") model.splice(n, 1);
    else if (b.dataset.act === "up" && n > 0) [model[n - 1], model[n]] = [model[n], model[n - 1]];
    else if (b.dataset.act === "down" && n < model.length - 1) [model[n + 1], model[n]] = [model[n], model[n + 1]];
    else return;
    draw();
    onChange(model);
    if (b.dataset.add) root.querySelector(".qcard:last-child [data-f=text]")?.focus();
  };
  draw();
  onChange(model);
  return { set(m) { model.splice(0, model.length, ...m); draw(); onChange(model); } };
}

const inviteUrl = () => `${location.origin}${location.pathname}?room=${room}`;
document.addEventListener("click", async (e) => {
  if (!e.target.closest("[data-invite]")) return;
  try {
    await navigator.clipboard.writeText(inviteUrl());
    toast("🔗 Invite link copied. Paste it in the chat!");
  } catch {
    prompt("Copy this invite link:", inviteUrl());
  }
});
document.addEventListener("click", (e) => {
  if (!e.target.closest("[data-close-room]")) return;
  if (confirm("Close the room? Everyone gets disconnected and the code stops working.")) sendMsg({ t: "close" });
});

const drawMute = () => ($("#mutebtn").textContent = muted ? "🔇" : "🔊");
drawMute();
$("#mutebtn").onclick = () => { muted = !muted; store.set("rr-mute", muted ? "1" : "0"); drawMute(); unlockAudio(); };

// Keys 1-9 pick an answer: players by button position, the Play-along host by card.
document.addEventListener("keydown", (e) => {
  const n = +e.key;
  if (!(n >= 1 && n <= 9) || e.ctrlKey || e.metaKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return;
  if (state?.phase !== "question") return;
  if (role === "player") document.querySelectorAll(".answer")[n - 1]?.click();
  else if (role === "host" && state.mode === "play") document.querySelectorAll(".tile[data-i]")[n - 1]?.click();
});

/* ---------- host modes ---------- */
const lobbyMode = () => (store.get("rr-mode") === "play" ? "play" : "gm");

function settingsHTML(st, allMods) {
  return `<div class="settings">
    <label>⏱️ Answer time <select data-set="seconds">${SECONDS.map((n) => `<option value="${n}" ${st.seconds === n ? "selected" : ""}>${n}s</option>`).join("")}</select></label>
    <label><input type="checkbox" data-set="powerups" ${st.powerups ? "checked" : ""}> 🎲🧊 Power-ups</label>
    <div class="mods">${allMods.map((m) => `<label class="modchip" style="--c:${m.color}"><input type="checkbox" data-mod="${m.id}" ${st.mods.includes(m.id) ? "checked" : ""}> ${m.emoji} ${esc(m.label)}</label>`).join("")}</div>
  </div>`;
}
function readSettings(root) {
  return {
    seconds: +root.querySelector('[data-set="seconds"]').value,
    powerups: root.querySelector('[data-set="powerups"]').checked,
    mods: [...root.querySelectorAll("[data-mod]")].filter((x) => x.checked).map((x) => x.dataset.mod),
  };
}

// Play along: the host screen also holds a player seat, on its own socket.
function connectMine(onFirstState) {
  if (mine) return onFirstState?.();
  const api = new URL(API), proto = api.protocol === "https:" ? "wss" : "ws";
  const pid = "host-" + (store.get("rr-host-" + room) || "").slice(0, 12);
  const name = store.get("rr-hostplayer-" + room) || "Host";
  mine = new WebSocket(`${proto}://${api.host}/ws/${room}?role=player&pid=${encodeURIComponent(pid)}&name=${encodeURIComponent(name)}`);
  mine.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.t !== "state") return; // events already arrive on the host socket
    mineState = msg;
    document.body.classList.add("playing");
    renderMine();
    if (onFirstState) { const f = onFirstState; onFirstState = null; f(); }
  };
  mine.onclose = (ev) => {
    mine = null;
    if (ev.code < 4000) setTimeout(() => connectMine(), 1200);
  };
}
const sendMine = (m) => mine?.readyState === 1 && mine.send(JSON.stringify(m));

function renderMine() {
  const bar = $("#mybar"), s = mineState;
  if (!s || !state || state.mode !== "play") { document.body.classList.remove("playing"); return; }
  document.body.classList.add("playing");
  const me = s.me;
  const who = `<span class="who">${me.emoji} ${esc(me.name)} · ${me.score}</span>`;
  mineFrozen = s.phase === "question" && serverNow() < me.frozenUntil;
  let html = who;
  if (s.phase === "question" && s.q) {
    const answered = me.answer !== null;
    if (mineFrozen) html += `<span class="frz">🧊 Frozen by ${esc(me.frozenBy)}</span>`;
    else if (answered) html += `<span class="display">🔒 Locked in</span>`;
    else html += `<span class="display">👆 Click a card to answer</span>`;
    if (s.powerups) html += `
      <button class="power ${me.allInActive ? "on" : ""}" data-p="allin" ${me.allInUsed || answered ? "disabled" : ""}>🎲 ${me.allInActive ? "ALL-IN!" : "All-in"}</button>
      ${me.swapPending ? `<button class="power on" disabled>🔄 Swap armed</button>` : `<button class="power" data-p="prank" ${me.prank ? "" : "disabled"}>${me.prank ? PRANK_INFO[me.prank].slice(0, 2).join(" ") : "🃏 No prank"}</button>`}`;
  } else if (s.phase === "reveal" && s.result) {
    const r = s.result;
    html += `<span class="display ${r.delta > 0 ? "up" : r.delta < 0 ? "down" : "muted"}">${r.delta > 0 ? "+" : ""}${r.delta}</span>${r.note ? `<span class="muted">${esc(r.note)}</span>` : ""}<span class="muted">#${me.rank}</span>`;
  } else if (s.phase === "end") {
    html += `<span class="display">#${me.rank} of ${s.playerCount}</span>`;
  } else {
    html += `<span class="muted">You're playing too 🎮</span>`;
  }
  document.body.classList.toggle("locked", s.phase !== "question" || me.answer !== null || mineFrozen);
  bar.innerHTML = html;
  bar.querySelectorAll("[data-p]").forEach((b) => (b.onclick = () => sendMine({ t: b.dataset.p })));
}

// Game master: a separate window so upcoming answers never hit the shared screen.
$("#cpbtn").onclick = () => window.open(`${location.pathname}?host=${room}&panel=1`, "rr-panel", "width=820,height=900");
let panelBuilt = false;
function renderPanel() {
  const s = state;
  if (s.mode !== "gm" && s.phase !== "lobby") {
    app.innerHTML = `<div class="panel"><h1 class="display">🎛️ Control panel</h1><p class="muted">This game is in Play-along mode, so there's nothing to control here.</p></div>`;
    panelBuilt = false;
    return;
  }
  if (!panelBuilt) {
    panelBuilt = true;
    app.innerHTML = `
      <div class="panel">
        <h1 class="display">🎛️ Control panel · ${esc(s.code)}</h1>
        <section class="card"><h2>Now</h2><div id="pnow"></div><div class="row" id="pactions"></div></section>
        <section class="card"><h2>Settings</h2><div id="psettings">${settingsHTML(s.settings, s.allMods)}</div><small class="muted">Changes apply from the next question.</small></section>
        <section class="card"><h2>Up next (<span id="pqn"></span>)</h2><div id="pqueue"></div>
          <div id="padd"></div>
          <div class="row"><button class="big" id="paddbtn">➕ Add to queue</button><button class="ghost" id="potdb">🌐 Add 5 random trivia</button></div>
        </section>
      </div>`;
    $("#psettings").onchange = () => sendMsg({ t: "settings", settings: readSettings($("#psettings")) });
    const draft = [blankQ()];
    const addEditor = mountEditor($("#padd"), draft, () => {});
    $("#potdb").onclick = async () => {
      const qs = await withCooldown($("#potdb"), () => fetchTrivia(5, "mix", "any"));
      if (!qs.length) return toast("Open Trivia DB didn't answer. Try again in a few seconds");
      sendMsg({ t: "queueAdd", questions: serializeQs(qs) });
    };
    $("#paddbtn").onclick = () => {
      if (!draft.some(qValid)) return toast("Finish the question first (text, 2+ answers, a ✔)");
      sendMsg({ t: "queueAdd", questions: serializeQs(draft) });
      addEditor.set([blankQ()]);
    };
  }
  const phaseLabel = { lobby: "In the lobby", spin: "Spinning the wheel", question: "Question live", reveal: "Showing results", end: "Game over" }[s.phase];
  let now = `<p><b>${phaseLabel}</b>${s.phase !== "lobby" ? ` · Q ${Math.min(s.qi + 1, s.total)} / ${s.total}` : ""}</p>`;
  if (s.q && s.phase !== "end") {
    const done = s.players.filter((p) => p.answered).length, live = s.players.filter((p) => p.connected).length;
    now += `<p><b>${esc(s.q.text)}</b> <span class="muted">· ${s.mod.emoji} ${esc(s.mod.label)}</span></p>` +
      (s.q.kind === "quiz" ? s.q.options.map((o, i) => `<div class="opt ${i === s.q.correct ? "right" : ""}">${i === s.q.correct ? "✔" : "·"} ${esc(o)}</div>`).join("") : `<p class="muted">Team vote</p>`) +
      (s.phase === "question" ? `<p class="muted">${done}/${live} locked in</p>` : "");
  }
  $("#pnow").innerHTML = now;
  const last = s.qi + 1 >= s.total;
  $("#pactions").innerHTML =
    (s.phase === "lobby" ? `<span class="muted">Start the game from the main screen.</span>` : "") +
    (s.phase === "question" ? `<button class="big" data-a="skip">Reveal now ⏭</button>` : "") +
    (s.phase === "reveal" ? `<button class="big" data-a="next">${last ? "Final results 🏆" : "Next ▶"}</button>` : "") +
    (s.phase === "end" ? `<button class="big" data-a="again">Run it back 🔁</button>` : "") +
    (["spin", "question", "reveal"].includes(s.phase) ? `<button class="ghost" data-a="end">End game now</button>` : "") +
    `<button class="ghost" data-close-room>✕ Close room</button>`;
  $("#pactions").querySelectorAll("[data-a]").forEach((b) => (b.onclick = () => {
    if (b.dataset.a === "end" && !confirm("End the game and show the podium?")) return;
    sendMsg({ t: b.dataset.a });
  }));
  const ps = $("#psettings");
  if (!ps.contains(document.activeElement)) ps.innerHTML = settingsHTML(s.settings, s.allMods);
  $("#pqn").textContent = s.queue.length;
  $("#pqueue").innerHTML = s.queue.length
    ? s.queue.map((q) => `<div class="qrow"><div>${q.kind === "vote" ? "🗳️" : "🧠"} ${esc(q.text)}${q.kind === "quiz" ? `<br><small>✔ ${esc(q.options[q.correct])}</small>` : ""}</div><button class="ghost" data-rm="${q.i}">✕</button></div>`).join("")
    : `<p class="muted">${s.phase === "lobby" ? "Questions are set in the lobby on the main screen." : "Nothing queued. Add some below, or the game ends after this one."}</p>`;
  $("#pqueue").querySelectorAll("[data-rm]").forEach((b) => (b.onclick = () => sendMsg({ t: "queueRemove", i: +b.dataset.rm })));
  $("#paddbtn").disabled = s.phase === "lobby" || s.phase === "end";
  $("#potdb").disabled = $("#paddbtn").disabled || !!$("#potdb").dataset.cooling;
}

/* ---------- per-frame: timer bar, last-seconds ticks, unfreeze ---------- */
(function loop() {
  if (state && state.phase === "question") {
    const left = Math.max(0, state.deadline - serverNow());
    const k = left / state.duration;
    document.querySelectorAll(".timer-fill").forEach((el) => {
      el.style.transform = `scaleX(${k})`;
      el.style.backgroundPosition = `${k * 100}% 0`;
    });
    const secs = Math.ceil(left / 1000);
    document.querySelectorAll(".timer-num").forEach((el) => (el.textContent = secs));
    if (role === "host") clockFrame(left);
    if (role === "host" && mineState && mineFrozen !== (serverNow() < mineState.me.frozenUntil)) renderMine();
    if (role === "player") {
      const f = state.me.frozenUntil - serverNow();
      const fs = $("#fsecs");
      if (fs) fs.textContent = Math.max(0, Math.ceil(f / 1000));
      const fogged = serverNow() < state.me.fogUntil;
      if (!!$(".frozen") !== f > 0 || !!$(".fog") !== fogged) render();
    }
  }
  requestAnimationFrame(loop);
})();

/* ---------- boot ---------- */
if (params.get("host") && store.get("rr-host-" + params.get("host").toUpperCase())) {
  room = params.get("host").toUpperCase();
  role = params.get("panel") ? "panel" : "host";
  connect();
  if (role === "host" && store.get("rr-hostplayer-" + room)) connectMine();
} else if (params.get("room") && store.get("rr-name")) {
  room = params.get("room").toUpperCase(); role = "player"; connect();
} else {
  landing();
}
</script>
